---
- name: Load connection and GitHub SSH keys into local agent
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    connection_ssh_key_path: "{{ lookup('ansible.builtin.env', 'SSH_PRIVATE_KEY_PATH') }}"
    github_ssh_key_path: "{{ lookup('ansible.builtin.env', 'GITHUB_SSH_KEY_PATH') }}"

  tasks:
    - name: Drop any stale copy of the connection key from the local agent
      ansible.builtin.command: ssh-add -d {{ connection_ssh_key_path }} # control node only - clears a previously-loaded (possibly rotated) identity for this key path, never touches the target host
      changed_when: false
      failed_when: false

    - name: Load connection key into local agent
      ansible.builtin.command: ssh-add {{ connection_ssh_key_path }} # control node only - the next play's SSH connection to the target host authenticates via this agent-loaded key, never a copied file
      changed_when: false

    - name: Load GitHub key into local agent for forwarding
      ansible.builtin.command: ssh-add {{ github_ssh_key_path }} # popos_desktop GitHub account key - forwarded to the target host below, never copied there
      changed_when: false

- name: Clone/pull the repository and deploy it onto the target host
  hosts: all
  become: false

  vars:
    ansible_ssh_common_args: "-o ForwardAgent=yes" # forwards the local agent (holding both keys loaded above) so GitHub auth over SSH works on the target host too, without ever copying a private key there

    git_repo_url: "{{ lookup('ansible.builtin.env', 'GIT_REPO_URL') }}"
    git_repo_dest: "{{ lookup('ansible.builtin.env', 'GIT_REPO_DEST') }}"

    # "Ephemeral" is a property of the auth key itself (generated in the
    # Tailscale admin console with the "Ephemeral" option checked), not
    # something this task controls - a node registered with an ephemeral
    # key auto-removes from the tailnet once it disconnects.
    tailscale_auth_key: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') }}"
    tailscale_hostname: "{{ lookup('ansible.builtin.env', 'TF_VAR_vm_name') }}"

    # Same key the backend uses (STRIPE_SECRET_KEY) - passing it to the CLI
    # explicitly pins `stripe listen` to that account. A bare `stripe login`
    # can end up authed to a different account/sandbox, in which case real
    # checkout events never reach the forwarder.
    stripe_secret_key: "{{ lookup('ansible.builtin.env', 'STRIPE_SECRET_KEY') }}"
    stripe_forward_to: "localhost:8080/stripe/webhook"

  tasks:
    # Both of the next two tasks run before the clone so github.com resolves.
    #
    # tailscaled can't use the systemd-resolved integration on this image
    # ("Access denied: dns-osconfig dump" in `tailscale dns status`), so with
    # the default --accept-dns=yes it falls back to its "direct" manager and
    # overwrites /etc/resolv.conf as a plain file pointing only at MagicDNS
    # (100.100.100.100). This tailnet has no global resolver for non-ts.net
    # names and tailscaled can't read the system's real ones either, so every
    # public lookup then fails - and disabling it later doesn't restore the
    # file, it has no saved original. --accept-dns=false stops it recurring.
    - name: Register the VM on Tailscale
      become: true # tailscale up needs root to configure the tailscale0 interface, unlike the clone task below
      ansible.builtin.command: >
        tailscale up
        --authkey={{ tailscale_auth_key }}
        --hostname={{ tailscale_hostname }}
        --accept-dns=false
      no_log: true # the auth key would otherwise be printed in task output/logs
      changed_when: true

    # Undo any earlier clobbering: point /etc/resolv.conf back at the
    # systemd-resolved stub (127.0.0.53), which forwards to the eth0
    # nameservers set by the terraform `dns` block.
    - name: Restore the systemd-resolved resolv.conf symlink
      become: true
      ansible.builtin.file:
        src: /run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true

    - name: Clone or update repository from GIT_REPO_URL
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_repo_dest }}"
        version: main
        update: true
        accept_hostkey: true
        # This clone is purely a deploy target, nobody's meant to be
        # hand-editing it - "local modifications" here are just leftover
        # noise from the previous deploy (e.g. docker compose build
        # writing back into bind-mounted paths as root, changing file
        # ownership on tracked files), not state worth preserving.
        force: true

    - name: Write production .env file
      # src, not content: - the secret text stays out of ansible's logged
      # module args this way, so this task doesn't need no_log: true.
      # ENV_FILE is already sitting on disk here (the GH Actions "Write
      # .env" step wrote it into the workspace before this playbook ran).
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ git_repo_dest }}/.env"
        mode: "0600"

    # ------------------------------------------------------------------
    # Stripe CLI webhook forwarder.
    #
    # This host has no dashboard-registered Stripe webhook endpoint, so a
    # long-lived `stripe listen` (systemd unit, further down) forwards
    # checkout events to the backend. Its signing secret has to match the
    # backend's STRIPE_WEBHOOK_SECRET, so we resolve it here and overwrite
    # whatever value the .env just landed with, before the stack comes up.
    # ------------------------------------------------------------------

    - name: Ensure the apt keyrings directory exists
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: stripe_secret_key | length > 0

    - name: Add the Stripe CLI signing key
      become: true
      ansible.builtin.get_url:
        url: https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public
        dest: /etc/apt/keyrings/stripe.asc
        mode: "0644"
      when: stripe_secret_key | length > 0

    - name: Add the Stripe CLI apt source
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/stripe.asc] https://packages.stripe.dev/stripe-cli-debian-local stable main"
        filename: stripe
        state: present
      when: stripe_secret_key | length > 0

    - name: Install the Stripe CLI
      become: true
      ansible.builtin.apt:
        name: stripe
        state: present
        update_cache: true
      when: stripe_secret_key | length > 0

    - name: Resolve the webhook signing secret for this account
      # --print-secret returns the same secret the running listener uses, so
      # the backend can verify signatures. Tied to the api key we pass.
      ansible.builtin.command: stripe listen --api-key {{ stripe_secret_key }} --print-secret
      register: stripe_webhook_secret
      changed_when: false
      no_log: true
      when: stripe_secret_key | length > 0

    - name: Point the backend's .env at that webhook secret
      ansible.builtin.lineinfile:
        path: "{{ git_repo_dest }}/.env"
        regexp: '^STRIPE_WEBHOOK_SECRET='
        line: "STRIPE_WEBHOOK_SECRET={{ stripe_webhook_secret.stdout | trim }}"
      no_log: true
      when: stripe_secret_key | length > 0

    - name: Build the application stack
      # --no-cache: `docker compose up --build` alone was reusing a stale
      # RUN npm install layer across deploys despite package.json actually
      # changing content between them, leaving a dependency missing from
      # the built image. Rebuilding from scratch every deploy costs time
      # but guarantees this can't recur regardless of the exact caching
      # mechanism at fault.
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml build --no-cache
        chdir: "{{ git_repo_dest }}"
      changed_when: true

    - name: Bring up the application stack
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
        chdir: "{{ git_repo_dest }}"
      changed_when: true

    # Started after the stack is up so forwarded events don't hit a
    # backend that isn't listening yet. Restart=always keeps it alive
    # across crashes; it's re-'restarted' every deploy to pick up a
    # rotated key.
    - name: Install the stripe-listen systemd unit
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/stripe-listen.service
        mode: "0644"
        content: |
          [Unit]
          Description=Stripe CLI webhook forwarder
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Environment=STRIPE_API_KEY={{ stripe_secret_key }}
          ExecStart=/usr/bin/stripe listen --forward-to {{ stripe_forward_to }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      no_log: true # the api key is in the unit body
      when: stripe_secret_key | length > 0

    - name: Enable and (re)start stripe-listen
      become: true
      ansible.builtin.systemd:
        name: stripe-listen
        enabled: true
        state: restarted
        daemon_reload: true
      when: stripe_secret_key | length > 0

    - name: Prune dangling images
      ansible.builtin.command: docker image prune -f
      changed_when: true

