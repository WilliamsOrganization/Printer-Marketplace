- hosts: app
  become: true
  tasks:
    - name: install packages
      apt:
        name:
          - git
          - openssh-server
          - curl
          - vim
          - docker.io
        state: present
        update_cache: true

    - name: copy public key
      authorized_key:
        user: root
        key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
        state: present

    - name: copy git credentials
      copy:
        src: ~/.ssh/popos_desktop
        dest: /root/.ssh/popos_desktop
        mode: '0600'
        
    - name: clone repo
      git:
        repo: git@github.com:ewanchukwilliam/Printer-Marketplace.git
        dest: /app
        version: main
        key_file: /root/.ssh/popos_desktop
        accept_hostkey: yes

