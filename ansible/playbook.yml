---
- name: Load connection and GitHub SSH keys into local agent
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    connection_ssh_key_path: "{{ lookup('ansible.builtin.env', 'SSH_PRIVATE_KEY_PATH') }}"
    github_ssh_key_path: "{{ lookup('ansible.builtin.env', 'GITHUB_SSH_KEY_PATH') }}"

  tasks:
    - name: Drop any stale copy of the connection key from the local agent
      ansible.builtin.command: ssh-add -d {{ connection_ssh_key_path }} # control node only - clears a previously-loaded (possibly rotated) identity for this key path, never touches the target host
      changed_when: false
      failed_when: false

    - name: Load connection key into local agent
      ansible.builtin.command: ssh-add {{ connection_ssh_key_path }} # control node only - the next play's SSH connection to the target host authenticates via this agent-loaded key, never a copied file
      changed_when: false

    - name: Load GitHub key into local agent for forwarding
      ansible.builtin.command: ssh-add {{ github_ssh_key_path }} # popos_desktop GitHub account key - forwarded to the target host below, never copied there
      changed_when: false

- name: Clone/pull the repository and deploy it onto the target host
  hosts: all
  become: false

  vars:
    ansible_ssh_common_args: "-o ForwardAgent=yes" # forwards the local agent (holding both keys loaded above) so GitHub auth over SSH works on the target host too, without ever copying a private key there

    git_repo_url: "{{ lookup('ansible.builtin.env', 'GIT_REPO_URL') }}"
    git_repo_dest: "{{ lookup('ansible.builtin.env', 'GIT_REPO_DEST') }}"
    env_file_content: "{{ lookup('ansible.builtin.env', 'ENV_FILE') }}"

    # "Ephemeral" is a property of the auth key itself (generated in the
    # Tailscale admin console with the "Ephemeral" option checked), not
    # something this task controls - a node registered with an ephemeral
    # key auto-removes from the tailnet once it disconnects.
    tailscale_auth_key: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') }}"
    tailscale_hostname: "{{ lookup('ansible.builtin.env', 'TF_VAR_vm_name') }}"

  tasks:
    - name: Clone or update repository from GIT_REPO_URL
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_repo_dest }}"
        version: main
        update: true
        accept_hostkey: true

    - name: Register the VM on Tailscale
      become: true # tailscale up needs root to configure the tailscale0 interface, unlike the clone task above
      ansible.builtin.command: >
        tailscale up
        --authkey={{ tailscale_auth_key }}
        --hostname={{ tailscale_hostname }}
      no_log: true # the auth key would otherwise be printed in task output/logs
      changed_when: true

    - name: Write production .env file
      ansible.builtin.copy:
        content: "{{ env_file_content }}"
        dest: "{{ git_repo_dest }}/.env"
        mode: "0600"
      no_log: true # env_file_content holds real secrets (DB password, Stripe keys, etc.)

    - name: Bring up the application stack
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
        chdir: "{{ git_repo_dest }}"
      changed_when: true

    - name: Prune dangling images
      ansible.builtin.command: docker image prune -f
      changed_when: true

