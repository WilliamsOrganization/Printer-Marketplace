services:
  postgres:
    volumes:
      - /data/postgres:/var/lib/postgresql/data

  frontend:
    volumes: []
    environment:
      - NODE_ENV=production
    # base Dockerfile's CMD is `npm run dev` (next dev) unconditionally -
    # this is what actually makes prod run a real build instead of the
    # Turbopack dev server.
    command: sh -c "npm install && npm run build && npm run start"

  backend:
    volumes:
      - maven-cache:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  nginx:
    volumes:
      - ./nginx/prod/nginx.conf:/etc/nginx/conf.d/default.conf
