server {
	# Docker's embedded DNS - resolving frontend/backend through a variable
	# (instead of a bare hostname directly in proxy_pass) forces nginx to
	# re-resolve on every request instead of caching whatever IP those
	# names had when nginx itself started. Without this, recreating
	# frontend/backend on a redeploy (docker compose up --build) leaves
	# nginx pointing at the old, now-dead container until nginx itself is
	# restarted.
	resolver 127.0.0.11 valid=10s;

	#frontend
	location / {
		set $frontend_upstream frontend:3000;
		proxy_pass http://$frontend_upstream;
	}
	#backend
	location /server/ {
		set $backend_upstream backend:8080;
		proxy_pass http://$backend_upstream;
	}
}
