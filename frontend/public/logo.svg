  <text x="215" y="103" class="sans" font-size="50" font-weight="500" letter-spacing="0.2" fill="#2B2B2B">Print</text>
  <text x="328" y="103" class="serif" font-size="64" font-style="italic" font-weight="500" fill="#2B2B2B">Market</text>

  <text x="217" y="130" class="sans" font-size="20" font-weight="500" letter-spacing="5" fill="#6F7C84">
    3D PRINTING
