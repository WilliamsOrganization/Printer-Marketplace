  <path d="M113 94L145 112L177 94" stroke="#F0ECE6" stroke-width="4.5" stroke-linecap="round" opacity="0.62"/>
  <path d="M113 107L145 125L177 107" stroke="#F0ECE6" stroke-width="4.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Hex top-edge highlights -->
  <path d="M145 26L205 60" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <path d="M145 26L85 60" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <!-- Nozzle — simplified cap + taper + filament dot -->
  <rect x="137" y="8" width="16" height="14" rx="4" fill="#4A5860"/>
  <path d="M139 22H151L148 34H142Z" fill="#8A949A"/>
  <circle cx="145" cy="40" r="3.5" fill="#3C6E2E"/>

