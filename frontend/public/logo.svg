<svg width="600" height="170" viewBox="55 2 600 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rightFace" x1="185" y1="72" x2="145" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#707E86"/>
      <stop offset="1" stop-color="#4A5860"/>
    </linearGradient>
    <linearGradient id="topFace" x1="105" y1="72" x2="185" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C7A37"/>
      <stop offset="1" stop-color="#356628"/>
    </linearGradient>
    <style>
      .sans { font-family: Geist, Inter, Helvetica, Arial, sans-serif; }
      .serif { font-family: "Playfair Display", Georgia, serif; }
