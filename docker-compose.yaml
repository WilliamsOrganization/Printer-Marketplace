services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # :z - relabel for SELinux (Fedora, enforcing). Without it the
      # container (container_t) is denied access to these host paths,
      # which sit under $HOME and are labelled user_home_t.
      - ./data/postgres:/var/lib/postgresql/data:z

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app:z
      - maven-cache:/root/.m2
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev/nginx.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - frontend
      - backend
      
volumes:
  maven-cache:
