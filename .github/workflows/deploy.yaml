# TODO: open outward facing port on router and configure DNS
# TODO: configure nginx/prod/nginx.conf for production reverse proxy routing
# TODO: migrate to Kubernetes (Talos on Proxmox) when scaling is needed
name: Deploy
on:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Apply
        run: |
          cd terraform
          TF_VAR_proxmox_host_endpoint="${{ secrets.TF_ENDPOINT }}" \
          TF_VAR_proxmox_environment_secret="${{ secrets.TF_SECRET }}" \
          terraform apply -auto-approve

  provision:
    needs: terraform
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.CONTAINER_SSH_KEY }}" > ~/.ssh/popos_desktop
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/popos_desktop
          ssh-keyscan "${{ secrets.VM_TAILNET_IP }}" >> ~/.ssh/known_hosts
      - name: Run Ansible
        run: ansible-playbook -i "${{ secrets.VM_TAILNET_IP }}," ansible/playbook.yml
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
