# TODO: open outward facing port on router and configure DNS
# TODO: configure nginx/prod/nginx.conf for production reverse proxy routing
# TODO: migrate to Kubernetes (Talos on Proxmox) when scaling is needed
name: Deploy
on:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # This runner has no persistent .env of its own (it's a fresh VM/
      # checkout every time, and .env is gitignored so checkout never
      # brings one in) - ENV_FILE is the same blob written onto the app VM
      # elsewhere, reused here as the source of every TF_VAR_* this needs.
      - name: Write .env
        run: echo "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      # deploy.tf's proxmox provider block reads TF_VAR_proxmox_ssh_key_path
      # (~/.ssh/id_ed25519) directly off disk for its own SSH connection to
      # the Proxmox host (snippet uploads) - it's not just ansible that
      # needs this key.
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.CONTAINER_SSH_KEY }}" > ~/.ssh/popos_desktop
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/popos_desktop
      - name: Terraform Apply
        run: |
          set -a
          source .env
          set +a
          cd terraform
          terraform init
          terraform apply -auto-approve

  provision:
    needs: terraform
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: echo "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      # A freshly-created VM isn't on the tailnet yet - that only happens
      # inside the ansible run below (the "Register the VM on Tailscale"
      # task), which needs a working connection to get there in the first
      # place. So this first connection has to go over the LAN IP
      # (TF_VAR_vm_ip) that Terraform's cloud-init assigns immediately -
      # the runner is on the same Proxmox bridge as the app VM, so this is
      # directly reachable without Tailscale.
      - name: Setup SSH Keys
        run: |
          set -a
          source .env
          set +a
          set -x
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.CONTAINER_SSH_KEY }}" > ~/.ssh/popos_desktop
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/popos_desktop
          # A recreated VM gets a fresh host key, so the old entry (if any)
          # would otherwise trip a REMOTE HOST IDENTIFICATION HAS CHANGED
          # failure - drop it before scanning the current one.
          ssh-keygen -f ~/.ssh/known_hosts -R "$TF_VAR_vm_ip" || true
          ssh-keyscan -T 5 "$TF_VAR_vm_ip" >> ~/.ssh/known_hosts
      - name: Run Ansible
        run: |
          set -a
          source .env
          set +a

          # playbook.yml's first play ssh-adds keys into the local agent
          # for forwarding - nothing starts one in a fresh Actions shell by
          # default, so ssh-add has nothing to connect to without this.
          eval "$(ssh-agent -s)"

          # -u is required now that there's no inventory.ini setting
          # ansible_user - without it ansible defaults to whatever OS user
          # the runner's systemd service runs as, not the account
          # Terraform actually authorized on the target VM.
          ansible-playbook -i "$TF_VAR_vm_ip," -u "$TF_VAR_image_user" ansible/playbook.yml

          kill "$SSH_AGENT_PID"
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
